<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>YawaChatHub — OBS widget</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body {
        padding: 10px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6px; /* только расстояние до служебного hint, не до сообщений */
        font-family: var(--font, "Onest", "Segoe UI", system-ui, sans-serif);
      }
      body.dir-down { justify-content: flex-start; }
      /* Единственный настраиваемый интервал — строго между .msg в ленте. */
      #stack { display: flex; flex-direction: column; gap: var(--message-gap, 6px); }
      body.dir-down #stack { flex-direction: column; }

      .msg {
        position: relative;
        padding: var(--pad-y, 9px) 12px;
        line-height: 1.4;
      }
      /* Компактные строки: почти без внутреннего отступа — текст к тексту,
         даже если включена плашка-фон. */
      .msg.compact {
        padding: var(--pad-y, 2px) 8px;
        line-height: 1.3;
      }
      .msg {
        border-radius: var(--r, 12px);
        background: var(--bg, rgba(10, 11, 18, 0.7));
        background-image: var(--bg-image, none);
        background-size: cover;
        background-position: center;
        border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
        box-shadow: var(--shadow, none);
        color: var(--text, #f2f3f8);
        font-size: var(--fs, 16px);
        font-weight: var(--fw, 500);
        letter-spacing: var(--ls, 0);
        text-shadow: var(--tsh, none);
        line-height: 1.4;
        overflow-wrap: anywhere;
        word-break: normal;
        white-space: normal;
        backdrop-filter: blur(var(--blur, 0px));
      }
      .msg .row { display: flex; align-items: flex-start; gap: 8px; }
      .msg .body { min-width: 0; flex: 1; }
      .msg .who {
        font-weight: var(--nfw, 700);
        color: var(--name, #a78bfa);
        text-shadow: var(--nsh, none);
        margin-right: 2px;
      }
      .msg .sep {
        opacity: 0.55;
        margin-right: 6px;
      }
      .msg.upper .who { text-transform: uppercase; }
      .msg .time {
        flex: 0 0 auto;
        margin-top: 0.2em;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.72em;
        line-height: 1.15;
        opacity: 0.6;
      }
      .msg .plat {
        display: inline-grid;
        place-items: center;
        width: 1.15em;
        height: 1.15em;
        flex: 0 0 auto;
        margin-top: 0.15em;
        color: var(--plat-color, #a78bfa);
        line-height: 1;
      }
      .msg .plat svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .plat.circle { border-radius: 50%; }
      .plat.rounded { border-radius: 5px; }
      .plat.square { border-radius: 2px; }
      .plat.glow { box-shadow: 0 0 10px currentColor; }
      .msg .emote { height: 1.4em; vertical-align: -0.3em; margin: 0 1px; }

      .msg.out { opacity: 0; transform: translateY(-6px); transition: all 0.35s ease; }

      /* ---------- анимации появления ---------- */
      .fx-fade { animation: fx-fade var(--dur, .32s) ease-out both; }
      .fx-slide-up { animation: fx-slide-up var(--dur, .32s) cubic-bezier(.22,1,.36,1) both; }
      .fx-slide-left { animation: fx-slide-left var(--dur, .32s) cubic-bezier(.22,1,.36,1) both; }
      .fx-scale { animation: fx-scale var(--dur, .32s) cubic-bezier(.22,1,.36,1) both; }
      .fx-blur { animation: fx-blur var(--dur, .32s) ease-out both; }
      .fx-bounce { animation: fx-bounce calc(var(--dur, .32s) * 1.5) cubic-bezier(.28,1.4,.5,1) both; }
      .fx-typewriter { animation: fx-fade var(--dur, .32s) ease-out both; }

      @keyframes fx-fade { from { opacity: 0 } to { opacity: 1 } }
      @keyframes fx-slide-up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
      @keyframes fx-slide-left { from { opacity: 0; transform: translateX(38px) } to { opacity: 1; transform: none } }
      @keyframes fx-scale { from { opacity: 0; transform: scale(.86) } to { opacity: 1; transform: none } }
      @keyframes fx-blur { from { opacity: 0; filter: blur(9px) } to { opacity: 1; filter: blur(0) } }
      @keyframes fx-bounce {
        0% { opacity: 0; transform: translateY(26px) scale(.95) }
        60% { opacity: 1; transform: translateY(-5px) scale(1.02) }
        100% { opacity: 1; transform: none }
      }

      #hint {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        opacity: 0.6;
        color: #9aa1b5;
      }
    </style>
  </head>
  <body>
    <div id="stack"></div>
    <div id="hint">ожидание подключения…</div>

    <script>
      const q = new URLSearchParams(location.search);
      const token = q.get("token") || "";
      const port = q.get("port") || location.port || "47823";

      const stack = document.getElementById("stack");
      const hint = document.getElementById("hint");
      const root = document.documentElement;

      const PLAT = {
        twitch: { c: "#a970ff" },
        youtube: { c: "#ff4e45" },
        vk: { c: "#4c8dff" },
        kick: { c: "#53fc18" },
        tiktok: { c: "#ff3b5c" },
      };

      // Иконки площадок в виджете — SVG paths, а не текстовые сокращения.
      // Официальные векторные логотипы (Simple Icons, 24×24)
      const PLATFORM_SVG = {
        twitch: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>',
        youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
        vk: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m9.489.004.729-.003h3.564l.73.003.914.01.433.007.418.011.403.014.388.016.374.021.36.025.345.03.333.033c1.74.196 2.933.616 3.833 1.516.9.9 1.32 2.092 1.516 3.833l.034.333.029.346.025.36.02.373.025.588.012.41.013.644.009.915.004.98-.001 3.313-.003.73-.01.914-.007.433-.011.418-.014.403-.016.388-.021.374-.025.36-.03.345-.033.333c-.196 1.74-.616 2.933-1.516 3.833-.9.9-2.092 1.32-3.833 1.516l-.333.034-.346.029-.36.025-.373.02-.588.025-.41.012-.644.013-.915.009-.98.004-3.313-.001-.73-.003-.914-.01-.433-.007-.418-.011-.403-.014-.388-.016-.374-.021-.36-.025-.345-.03-.333-.033c-1.74-.196-2.933-.616-3.833-1.516-.9-.9-1.32-2.092-1.516-3.833l-.034-.333-.029-.346-.025-.36-.02-.373-.025-.588-.012-.41-.013-.644-.009-.915-.004-.98.001-3.313.003-.73.01-.914.007-.433.011-.418.014-.403.016-.388.021-.374.025-.36.03-.345.033-.333c.196-1.74.616-2.933 1.516-3.833.9-.9 2.092-1.32 3.833-1.516l.333-.034.346-.029.36-.025.373-.02.588-.025.41-.012.644-.013.915-.009ZM6.79 7.3H4.05c.13 6.24 3.25 9.99 8.72 9.99h.31v-3.57c2.01.2 3.53 1.67 4.14 3.57h2.84c-.78-2.84-2.83-4.41-4.11-5.01 1.28-.74 3.08-2.54 3.51-4.98h-2.58c-.56 1.98-2.22 3.78-3.8 3.95V7.3H10.5v6.92c-1.6-.4-3.62-2.34-3.71-6.92Z"/></svg>',
        kick: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/></svg>',
        tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
      };
      let cfg = {

        fontSize: 16,
        dir: "up",
        duration: 8,
        maxMessages: 8,
        showPlatform: true,
        showTime: true,
        effect: "slide-up",
        effectDuration: 0.32,
      };
      let look = {
        id: "clean",
        background: "rgba(10,11,18,0.7)",
        border: "rgba(255,255,255,0.1)",
        shadow: "0 2px 14px rgba(0,0,0,0.35)",
        text: "#f2f3f8",
        name: "#a78bfa",
        sub: "rgba(242,243,248,0.45)",
        radius: 12,
        fontFamily: '"Onest","Segoe UI",system-ui,sans-serif',
        fontWeight: 500,
        nameWeight: 700,
        letterSpacing: 0,
        textShadow: "none",
        nameShadow: "none",
        iconShape: "rounded",
        iconGlow: false,
        uppercaseName: false,
        bgImage: "",
      };

      /* ---------- emotes ----------
         Глобальные наборы (7TV/BTTV/Kick) + смайлы КОНКРЕТНЫХ подключённых
         каналов (BTTV/7TV/FFZ для Twitch, свои эмодзи для Kick) — те же
         источники и та же логика, что в src/lib/emotes.ts для ленты/оверлея.
         Раньше виджет загружал только глобальные наборы, поэтому кастомные
         смайлы канала не отображались в OBS. */
      const emoteMap = new Map();
      const loadedEmoteKeys = new Set();
      const addEmote = (name, url) => { if (name && url && !emoteMap.has(name)) emoteMap.set(name, url); };

      async function fetchJson(url) {
        try {
          const r = await fetch(url, { headers: { accept: "application/json" } });
          return r.ok ? await r.json() : null;
        } catch { return null; }
      }

      async function loadGlobalEmotes() {
        const [seven, bttv] = await Promise.all([
          fetchJson("https://7tv.io/v3/emote-sets/global"),
          fetchJson("https://api.betterttv.net/3/cached/emotes/global"),
        ]);
        if (seven && seven.emotes) {
          for (const e of seven.emotes) {
            const host = e.data && e.data.host;
            if (!host || !host.url) continue;
            const files = host.files || [];
            const file = files.find((f) => f.name === "2x.webp") || files.find((f) => f.name === "1x.webp") || files[0];
            if (file && e.name) addEmote(e.name, "https:" + host.url + "/" + file.name);
          }
        }
        if (Array.isArray(bttv)) {
          for (const e of bttv) {
            if (e.code && e.id) addEmote(e.code, "https://cdn.betterttv.net/emote/" + e.id + "/2x.webp");
          }
        }
        // Kick: глобальные смайлы площадки.
        const kick = await fetchJson("https://kick.com/api/v2/emotes");
        const kickList = (kick && kick.data) || (Array.isArray(kick) ? kick : []);
        for (const e of kickList) {
          if (e && e.id && e.name) addEmote(e.name, "https://files.kick.com/emotes/" + e.id + "/fullsize");
        }
      }
      loadGlobalEmotes();

      /** Смайлы конкретного Twitch-канала: BTTV + 7TV + FFZ (по login). */
      async function loadTwitchChannelEmotes(loginName) {
        const key = "tw:" + loginName.toLowerCase();
        if (loadedEmoteKeys.has(key)) return;
        loadedEmoteKeys.add(key);
        const user = await fetchJson("https://api.betterttv.net/3/cached/users/twitch/" + encodeURIComponent(loginName));
        if (user) {
          const list = [...(user.channelEmotes || []), ...(user.sharedEmotes || [])];
          for (const e of list) if (e.id && e.code) addEmote(e.code, "https://cdn.betterttv.net/emote/" + e.id + "/2x.webp");
        }
        const providerId = user && user.id;
        if (!providerId) return;
        const [seven, ffz] = await Promise.all([
          fetchJson("https://7tv.io/v3/users/twitch/" + providerId),
          fetchJson("https://api.frankerfacez.com/v1/room/id/" + providerId),
        ]);
        const emotes = seven && seven.emote_set && seven.emote_set.emotes;
        if (Array.isArray(emotes)) {
          for (const e of emotes) {
            const host = e.data && e.data.host;
            if (!host || !host.url) continue;
            const files = host.files || [];
            const file = files.find((f) => f.name === "2x.webp") || files.find((f) => f.name === "1x.webp") || files[0];
            if (file && e.name) addEmote(e.name, "https:" + host.url + "/" + file.name);
          }
        }
        const sets = ffz && ffz.sets;
        if (sets) {
          for (const set of Object.values(sets)) {
            for (const e of (set && set.emoticons) || []) {
              const url = e.urls && (e.urls["2"] || e.urls["1"]);
              if (url) addEmote(e.name, url.startsWith("http") ? url : "https:" + url);
            }
          }
        }
      }

      /** Смайлы конкретного Kick-канала (по slug). */
      async function loadKickChannelEmotes(slug) {
        const key = "ki:" + slug.toLowerCase();
        if (loadedEmoteKeys.has(key)) return;
        loadedEmoteKeys.add(key);
        const ch = await fetchJson("https://kick.com/api/v2/channels/" + encodeURIComponent(slug));
        const userId = ch && ch.data && ch.data.user_id;
        if (!userId) return;
        const data = await fetchJson("https://kick.com/api/v2/channels/" + userId + "/emotes");
        const list = (data && data.data) || (Array.isArray(data) ? data : []);
        for (const e of list) if (e && e.id && e.name) addEmote(e.name, "https://files.kick.com/emotes/" + e.id + "/fullsize");
      }

      /** Вызывается при получении списка каналов от приложения (см. onmessage). */
      function loadChannelEmotesFor(list) {
        for (const c of list || []) {
          if (!c || !c.platform || !c.channelId) continue;
          if (c.platform === "twitch") loadTwitchChannelEmotes(String(c.channelId).replace(/^#/, ""));
          else if (c.platform === "kick") loadKickChannelEmotes(String(c.channelId).toLowerCase());
        }
      }

      function applyLook(next) {
        if (next.cfg) cfg = { ...cfg, ...next.cfg };
        if (next.look) look = { ...look, ...next.look };
        root.style.setProperty("--bg", look.background);
        root.style.setProperty("--bg-image", look.bgImage ? `url("${look.bgImage}")` : "none");
        root.style.setProperty("--border", look.border);
        root.style.setProperty("--shadow", look.shadow);
        root.style.setProperty("--r", (look.radius ?? 12) + "px");
        root.style.setProperty("--text", look.text);
        root.style.setProperty("--name", look.name);
        root.style.setProperty("--fs", (cfg.fontSize ?? 16) + "px");
        root.style.setProperty("--fw", look.fontWeight ?? 500);
        root.style.setProperty("--nfw", look.nameWeight ?? 700);
        root.style.setProperty("--ls", (look.letterSpacing ?? 0) + "px");
        root.style.setProperty("--tsh", look.textShadow || "none");
        root.style.setProperty("--nsh", look.nameShadow || "none");
        root.style.setProperty("--font", look.fontFamily);
        root.style.setProperty("--dur", (cfg.effectDuration ?? 0.32) + "s");
        root.style.setProperty("--blur", look.id === "glass" ? "10px" : "0px");
        root.style.setProperty("--message-gap", (cfg.rowGap ?? 6) + "px");
        // Компактные строки: класс на body — CSS уже читает его через .msg.compact;
        // заодно при компактном режиме сужаем сам интервал до минимального.
        document.body.classList.toggle("compact", !!cfg.compactRows);
        if (cfg.compactRows) {
          stack.classList.add("compact-rows");
          for (const el of stack.children) el.classList.add("compact");
        } else {
          stack.classList.remove("compact-rows");
          for (const el of stack.children) el.classList.remove("compact");
        }
        document.body.classList.toggle("dir-down", cfg.dir === "down");
        while (stack.children.length > (cfg.maxMessages || 8)) {
          stack.removeChild(stack.firstChild);
        }
      }

      function renderText(container, msg) {
        const rawParts = Array.isArray(msg.parts) && msg.parts.length ? msg.parts : null;
        if (rawParts) {
          for (const part of rawParts) {
            if (part.type === "emote" && part.url) {
              const img = document.createElement("img");
              img.className = "emote";
              img.src = part.url;
              img.alt = part.value || "";
              img.loading = "lazy";
              container.appendChild(img);
            } else {
              container.appendChild(document.createTextNode(part.value || ""));
            }
          }
          return;
        }
        const text = msg.text || "";
        const tokens = text.split(/(\s+)/);
        for (const tok of tokens) {
          if (!tok) continue;
          const url = emoteMap.get(tok);
          if (url) {
            const img = document.createElement("img");
            img.className = "emote";
            img.src = url;
            img.alt = tok;
            img.title = tok;
            container.appendChild(img);
          } else {
            container.appendChild(document.createTextNode(tok));
          }
        }
      }

      function addMessage(m) {
        if (!m || (!m.text && !m.parts)) return;
        if (m.sys) return;
        hint.style.display = "none";

        const el = document.createElement("div");
        el.className = "msg";
        if (cfg.compactRows || stack.classList.contains("compact-rows")) {
          el.classList.add("compact");
        }
        if (look.uppercaseName) el.classList.add("upper");
        if (cfg.effect && cfg.effect !== "none") el.classList.add("fx-" + cfg.effect);

        const row = document.createElement("div");
        row.className = "row";

        if (cfg.showTime) {
          const time = document.createElement("span");
          time.className = "time";
          const d = new Date(m.ts || Date.now());
          time.textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
          row.appendChild(time);
        }

        if (cfg.showPlatform) {
          const p = PLAT[m.platform] || { c: "#a78bfa" };
          const dot = document.createElement("span");
          dot.className = "plat " + (look.iconShape || "rounded") + (look.iconGlow ? " glow" : "");
          dot.style.setProperty("--plat-color", p.c);
          dot.innerHTML = PLATFORM_SVG[m.platform] || PLATFORM_SVG.twitch;
          row.appendChild(dot);
        }

        const body = document.createElement("div");
        body.className = "body";

        const who = document.createElement("span");
        who.className = "who";
        if (m.color && look.id === "clean") who.style.color = m.color;
        who.textContent = m.author || "зритель";
        body.appendChild(who);

        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = ":";
        body.appendChild(sep);

        const textSpan = document.createElement("span");
        if (cfg.effect === "typewriter") {
          body.appendChild(textSpan);
          const full = m.text || "";
          let i = 0;
          const speed = Math.max(12, ((cfg.effectDuration ?? 0.32) * 1000) / Math.max(full.length, 1));
          const tick = () => {
            const slice = full.slice(0, (i += 1));
            textSpan.textContent = "";
            const toks = slice.split(/(\s+)/);
            for (const tok of toks) {
              if (!tok) continue;
              const url = emoteMap.get(tok);
              if (url) {
                const img = document.createElement("img");
                img.className = "emote";
                img.src = url;
                img.alt = tok;
                textSpan.appendChild(img);
              } else {
                textSpan.appendChild(document.createTextNode(tok));
              }
            }
            if (i < full.length) setTimeout(tick, speed);
          };
          tick();
        } else {
          renderText(textSpan, m);
          body.appendChild(textSpan);
        }

        row.appendChild(body);
        el.appendChild(row);
        stack.appendChild(el);

        while (stack.children.length > (cfg.maxMessages || 8)) {
          stack.removeChild(stack.firstChild);
        }

        const ttl = cfg.duration ?? 8;
        if (ttl > 0) {
          setTimeout(() => {
            el.classList.add("out");
            setTimeout(() => el.remove(), 400);
          }, ttl * 1000);
        }
      }

      /* ─────────────── озвучка в OBS ───────────────
         Отдельный проигрыватель с очередью. Что здесь важно:

         1. Один переиспользуемый <audio>. Раньше на каждую фразу создавался
            new Audio(...) без сохранения ссылки — сборщик мусора мог оборвать
            воспроизведение на полуслове.
         2. Blob вместо data:-URL. WAV от SAPI весит мегабайты, а base64 в src
            раздувал строку ещё на треть и подтормаживал CEF.
         3. Очередь: фразы не накладываются друг на друга.
         4. Автовоспроизведение. Если браузерный источник запущен с политикой,
            требующей жеста пользователя, play() отклоняется. Раньше ошибка
            гасилась через .catch(() => {}) — звука нет и никаких следов.
            Теперь мы сообщаем об этом приложению, а звук пробуем разблокировать.  */
      const ttsAudio = new Audio();
      ttsAudio.preload = "auto";
      ttsAudio.autoplay = false;
      const ttsQueue = [];
      let ttsBusy = false;
      let ttsUrl = null;
      let audioBlocked = false;
      let socket = null;

      const report = (payload) => {
        try {
          if (socket && socket.readyState === 1) socket.send(JSON.stringify(payload));
        } catch { /* обратная связь не критична */ }
      };

      const releaseUrl = () => {
        if (ttsUrl) { URL.revokeObjectURL(ttsUrl); ttsUrl = null; }
      };

      function base64ToBlob(base64, mime) {
        const bin = atob(base64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }

      function playTts(data) {
        const audio = data.ttsAudio;
        const speak = data.ttsPlay;
        if (audio && audio.audioBase64) ttsQueue.push({ kind: "audio", ...audio });
        else if (speak && speak.text) ttsQueue.push({ kind: "speech", ...speak });
        // Очередь не должна расти бесконечно, если звук заблокирован.
        while (ttsQueue.length > 12) ttsQueue.shift();
        pumpTts();
      }

      function pumpTts() {
        if (ttsBusy) return;
        const item = ttsQueue.shift();
        if (!item) return;
        ttsBusy = true;
        const done = (info) => {
          ttsBusy = false;
          if (info) report(info);
          // Небольшая пауза между фразами, чтобы речь не сливалась.
          setTimeout(pumpTts, 120);
        };

        if (item.kind === "audio") {
          releaseUrl();
          const vol = Number(item.volume);
          ttsAudio.volume = Number.isFinite(vol) ? Math.max(0, Math.min(1, vol)) : 1;
          ttsUrl = URL.createObjectURL(base64ToBlob(item.audioBase64, item.mime || "audio/wav"));
          ttsAudio.src = ttsUrl;
          ttsAudio.onended = () => done({ type: "tts-status", id: item.id, state: "played" });
          ttsAudio.onerror = () => done({ type: "tts-status", id: item.id, state: "error" });
          ttsAudio.play().then(
            () => {
              if (audioBlocked) {
                audioBlocked = false;
                report({ type: "tts-status", state: "unblocked" });
              }
            },
            (err) => {
              // NotAllowedError — источник требует жеста пользователя.
              audioBlocked = String(err && err.name) === "NotAllowedError";
              report({
                type: "tts-status",
                id: item.id,
                state: audioBlocked ? "blocked" : "error",
                error: String((err && err.message) || err || ""),
              });
              done(null);
            }
          );
          return;
        }

        // Запасной путь: синтез силами самого браузерного источника.
        if (!window.speechSynthesis) { done({ type: "tts-status", id: item.id, state: "no-voice" }); return; }
        const u = new SpeechSynthesisUtterance(item.text);
        u.lang = "ru-RU";
        u.rate = item.rate || 1;
        u.volume = Number.isFinite(Number(item.volume)) ? Number(item.volume) : 1;
        const voices = window.speechSynthesis.getVoices();
        const picked = voices.find((x) => x.voiceURI === item.voice) ||
          voices.find((x) => /^ru/i.test(x.lang || ""));
        if (picked) u.voice = picked;
        u.onend = () => done({ type: "tts-status", id: item.id, state: "played" });
        u.onerror = () => done({ type: "tts-status", id: item.id, state: "error" });
        if (!voices.length) {
          // В OBS у CEF часто нет ни одного голоса — сообщаем честно,
          // чтобы приложение могло подсказать «включите вывод на этот компьютер».
          done({ type: "tts-status", id: item.id, state: "no-voice" });
          return;
        }
        window.speechSynthesis.speak(u);
      }

      // Любое взаимодействие со сценой снимает блокировку автовоспроизведения.
      for (const evt of ["click", "keydown", "pointerdown"]) {
        window.addEventListener(evt, () => {
          if (!audioBlocked) return;
          ttsAudio.play().then(() => {
            audioBlocked = false;
            report({ type: "tts-status", state: "unblocked" });
            pumpTts();
          }).catch(() => { /* всё ещё заблокировано */ });
        }, { passive: true });
      }

      function connect() {
        const ws = new WebSocket("ws://127.0.0.1:" + port + "/ws?token=" + encodeURIComponent(token));
        socket = ws;
        ws.onopen = () => {
          hint.textContent = "подключено, ждём сообщения…";
          // Сообщаем приложению, что источник готов принимать звук.
          report({ type: "hello", audio: typeof Audio !== "undefined" });
        };
        ws.onmessage = (ev) => {
          try {
            const data = JSON.parse(ev.data);
            // Озвучка приходит отдельным типом и больше не смешивается
            // с оформлением: раньше ttsAudio/ttsPlay ехали внутри "config",
            // и настройки виджета затирались служебным сообщением.
            if (data.type === "tts") playTts(data);
            else if (data.type === "config") {
              // Совместимость со старой схемой (виджет мог остаться открытым
              // в OBS с прошлой версии страницы).
              if (data.ttsAudio || data.ttsPlay) playTts(data);
              else applyLook(data);
            }
            else if (data.type === "chat") addMessage(data.msg);
            // Список подключённых каналов — подгружаем смайлы именно этих
            // каналов (BTTV/7TV/FFZ для Twitch, свои эмодзи для Kick).
            else if (data.type === "channels") loadChannelEmotesFor(data.list);
          } catch {}
        };
        ws.onclose = () => {
          hint.style.display = "block";
          hint.textContent = "нет соединения — переподключение…";
          setTimeout(connect, 2000);
        };
        ws.onerror = () => ws.close();
      }
      connect();
    </script>
  </body>
</html>
